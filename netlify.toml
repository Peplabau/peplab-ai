## Netlify build configuration for Vite (React SPA)
[build]
  command = "npm run build"
  publish = "dist"

# Keep the lock page and marketing landing on this host.
# Every other path is the same page on peplab.com.au.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/landing"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/landing/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "https://peplab.com.au/:splat"
  status = 301
